<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Todo App based on Eisenhower Matrix for task prioritization and productivity">
  <meta name="author" content="Todo App">
  <title>Todo App</title>
  <link href="https://fonts.googleapis.com/css?family=Lato:300,400,700" rel="stylesheet">
  <link rel="stylesheet" href="style.css" media="screen" charset="utf-8">
</head>

<body class="todo-app">
  <header class="matrix-header">
    <img class="matrix-header__image" src="./eisenhower-matrix.jpg"
      alt="Eisenhower Matrix diagram showing four quadrants for task prioritization">
    <a class="matrix-header__link" href="https://goal-life.com/page/method/matrix-eisenhower">
      Want more details?
    </a>
  </header>
  <main class="todo-app__main">
    <h1 class="todo-app__title">Todo App</h1>
    <section class="add-form">
      <h2 class="add-form__heading">Add Item</h2>
      <div class="add-form__container">
        <input id="new-task" class="add-form__input" type="text" placeholder="Enter new task">
        <button id="add-task" class="add-form__button" type="submit">Add</button>
      </div>
    </section>
    <section class="task-list">
      <h2 class="task-list__heading">Todo</h2>
      <ul id="todo" class="task-list__container">
        <li class="task">
          <input class="task__checkbox" type="checkbox">
          <label class="task__label">Pay Bills</label>
          <input class="task__input" type="text">
          <button class="task__button button_edit_task">Edit</button>
          <button class="task__button button_delete_task">
            <img class="task__icon" src="./remove.svg" alt="Delete task">
          </button>
        </li>
        <li class="task task_mode_edit">
          <input class="task__checkbox" type="checkbox">
          <label class="task__label">Go Shopping</label>
          <input class="task__input" type="text" value="Go Shopping">
          <button class="task__button button_edit_task">Save</button>
          <button class="task__button button_delete_task">
            <img class="task__icon" src="./remove.svg" alt="Delete task">
          </button>
        </li>
      </ul>
    </section>
    <section class="task-list task-list_type_completed">
      <h2 class="task-list__heading">Completed</h2>
      <ul id="completed" class="task-list__container">
        <li class="task">
          <input class="task__checkbox" type="checkbox" checked>
          <label class="task__label">See the Doctor</label>
          <input class="task__input" type="text">
          <button class="task__button button_edit_task">Edit</button>
          <button class="task__button button_delete_task">
            <img class="task__icon" src="./remove.svg" alt="Delete task">
          </button>
        </li>
      </ul>
    </section>
  </main>
  <script src="app.js"></script>
</body>

</html>
