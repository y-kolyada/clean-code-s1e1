<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Todo App based on Eisenhower Matrix for task prioritization and productivity">
  <meta name="author" content="Todo App">
  <title>Todo App</title>
  <link href="https://fonts.googleapis.com/css?family=Lato:300,400,700" rel="stylesheet">
  <link rel="stylesheet" href="style.css" media="screen" charset="utf-8">
</head>

<body class="page">
  <header class="matrix-header">
    <img src="./eisenhower-matrix.jpg">
    <a class="more-info" href="https://goal-life.com/page/method/matrix-eisenhower">
      Want more details?
    </a>
  </header>
  <main class="main">
    <h1 class="app-title">Todo App</h1>
    <section class="add-item-section">
      <h2 class="heading">Add Item</h2>
      <div class="add-item">
        <input id="new-task" class="task-input" type="text" placeholder="Enter new task">
        <button id="add-task" class="button" type="submit">Add</button>
      </div>
    </section>
    <section class="todo-section">
      <h2 class="heading">Todo</h2>
      <ul id="todo" class="task-list">
        <li class="task-item">
          <input type="checkbox">
          <label class="task-label">Pay Bills</label>
          <input type="text" class="task-input">
          <button class="edit button">Edit</button>
          <button class="delete button">
            <img src="./remove.svg">
          </button>
        </li>
        <li class="edit-mode task-item">
          <input type="checkbox">
          <label class="label">Go Shopping</label>
          <input type="text" value="Go Shopping" class="input">
          <button class="edit button">Save</button>
          <button class="delete button">
            <img src="./remove.svg">
          </button>
        </li>
      </ul>
    </section>
    <section class="completed-section">
      <h2 class="heading">Completed</h2>
      <ul id="completed" class="task-list">
        <li class="task-item">
          <input type="checkbox" checked>
          <label class="task-label">See the Doctor</label>
          <input type="text" class="task-input">
          <button class="edit button">Edit</button>
          <button class="delete button">
            <img src="./remove.svg">
          </button>
        </li>
      </ul>
    </section>
  </main>
  <script src="app.js"></script>
</body>

</html>
